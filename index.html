<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mind-atlas ── こころの地図</title>
<style>
  :root{
    --bg:#f7f6f3; --panel:#fffdfa; --line:#ddd8ce; --ink:#2f2b26; --sub:#6f675c;
    --accent:#5a6b8c; --code:#efece5;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1b1a18; --panel:#242220; --line:#3d3a35; --ink:#e6e2da;
           --sub:#9a938a; --accent:#8fa4c4; --code:#2e2b27; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
  #wrap{display:flex;height:100%}
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.04em}
  h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:8px}
  #cy{flex:1;min-height:0}
  input[type=search],select{padding:5px 9px;border:1px solid var(--line);border-radius:3px;
    background:var(--bg);color:var(--ink);font-size:13px}
  input[type=search]{width:170px}
  .filters{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
  .filters label{display:flex;align-items:center;gap:3px;cursor:pointer;user-select:none}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  #list{width:250px;border-right:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:12px 14px;font-size:12.5px;flex:none}
  #list.closed{display:none}
  #list h3{font-size:11.5px;color:var(--sub);margin:14px 0 5px;font-weight:600;
    letter-spacing:.06em;display:flex;align-items:center;gap:5px}
  #list h3:first-child{margin-top:0}
  #list ul{list-style:none;padding:0;margin:0}
  #list li{padding:2px 0;line-height:1.5}
  #list a{color:var(--ink);cursor:pointer;text-decoration:none;display:block;
    padding:2px 5px;border-radius:3px}
  #list a:hover{background:var(--code)}
  #list a.on{background:var(--code);font-weight:600}
  #list .n{color:var(--sub);font-size:10.5px;font-weight:400}
  #list .mk{font-size:9.5px;color:var(--sub);margin-left:3px}
  .books label{display:flex;align-items:flex-start;gap:5px;cursor:pointer;
    padding:3px 0;line-height:1.45;user-select:none}
  .books .sub{color:var(--sub);font-size:10.5px}
  .sheetbar{display:none}
  .grip{width:36px;height:4px;border-radius:2px;background:var(--line);display:block}
  .btn{padding:4px 9px;border:1px solid var(--line);border-radius:3px;background:var(--bg);
    color:var(--ink);font-size:12px;cursor:pointer}
  .btn:hover{background:var(--code)}
  #side{width:330px;border-left:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:16px;font-size:13px;line-height:1.75}
  #side h2{font-size:17px;margin:0 0 3px}
  #side .meta{color:var(--sub);font-size:11.5px;margin-bottom:14px;
    padding-bottom:10px;border-bottom:1px solid var(--line)}
  #side h3{font-size:12px;color:var(--sub);margin:16px 0 5px;font-weight:600;letter-spacing:.06em}
  #side .empty{color:var(--sub);line-height:1.9}
  code{background:var(--code);padding:1px 4px;border-radius:2px;font-size:12px}
  .badge{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11px;color:#fff;margin-right:5px}
  .conf{border:1px solid var(--line);padding:1px 6px;border-radius:2px;font-size:11px;color:var(--sub)}
  .rel{color:var(--sub);font-size:11px}
  ul.links{list-style:none;padding:0;margin:4px 0}
  ul.links li{padding:2px 0}
  ul.links a{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted}
  .stubmark{color:var(--sub);font-size:11px;margin-left:4px}
  /* 下敷きは白地の医学イラストなので、カードごと白で固定する */
  .brain{margin:7px 0 2px;border:1px solid var(--line);border-radius:4px;
    padding:4px;background:#fff}
  .brain svg{width:100%;height:auto;display:block}
  .brain .area{fill:transparent;stroke:none}
  .brain .area.hit{fill:#e0402a;fill-opacity:.42;stroke:#c2361f;stroke-width:1.1;
    filter:drop-shadow(0 0 3px rgba(224,64,42,.9)) drop-shadow(0 0 8px rgba(224,64,42,.5))}
  .brain .deep{fill:transparent;stroke:none}
  .brain .deep.hit{fill:#e0402a;fill-opacity:.26;stroke:#c2361f;stroke-width:1;
    stroke-dasharray:3.5 2.5;
    filter:drop-shadow(0 0 3px rgba(224,64,42,.75))}
  .brain .front{font-size:9px;fill:#8b857c}
  .brain .noimg{font-size:11px;fill:#8b857c}
  .brainnames{font-size:11.5px;color:var(--ink);margin:5px 0 0;line-height:1.65}
  .brainnames .hit{color:#c2542f;font-weight:600}
  .brainnote{font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.55}
  .brainnote a{color:var(--accent);text-decoration:none;border-bottom:1px dotted}
  .brcredit{padding-top:3px;border-top:1px solid var(--line)}
  ol.refs{padding-left:1.3em;margin:4px 0 0}
  ol.refs li{margin-bottom:9px}
  ol.refs a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(0,0,0,.12)}
  ol.refs .note{color:var(--sub);font-size:11.5px;line-height:1.6;margin-top:1px}
  ol.refs .url{color:var(--sub);font-size:10.5px;word-break:break-all;opacity:.75;margin-top:1px}
  .norefs{color:var(--sub);font-size:11.5px;line-height:1.7;border-left:2px solid var(--line);
    padding-left:9px;margin:5px 0 0}
  /* --- スマホ：3段積みをやめ、下からせり上がるシートにする --- */
  @media (max-width:760px){
    #wrap{flex-direction:column;position:relative;overflow:hidden}
    #main{flex:1;min-height:0}
    header{padding:8px 10px;gap:8px}
    h1{font-size:14px}
    h1 small{display:none}
    input[type=search]{width:104px}
    .filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      max-width:100%;padding-bottom:2px}
    .filters label{flex:none}

    #list, #side{
      position:fixed;left:0;right:0;bottom:0;top:auto;
      width:auto;max-height:none;
      height:80vh;
      height:80dvh;            /* アドレスバーで画面高が変わる端末むけ */
      border:0;border-top:1px solid var(--line);
      border-radius:14px 14px 0 0;
      box-shadow:0 -10px 28px rgba(0,0,0,.22);
      transform:translateY(101%);
      transition:transform .24s ease;
      z-index:30;
      padding:0 16px calc(26px + env(safe-area-inset-bottom));
      overscroll-behavior:contain;
    }
    /* .open が付いているときだけ出す（デスクトップの .closed より後に書いて勝たせる） */
    #list.open, #side.open{transform:translateY(0)}

    .sheetbar{display:flex;align-items:center;justify-content:flex-end;
      position:sticky;top:0;background:var(--panel);padding:10px 0 9px;z-index:2;
      isolation:isolate}
    .sheetbar .grip{position:absolute;left:50%;transform:translateX(-50%);top:5px}

    /* 読むための文字組み。スマホは指で読むので大きめに */
    #side{font-size:14px;line-height:1.85}
    #side h2{font-size:19px}
    #side h3{font-size:12.5px;margin:18px 0 6px}
    #list{font-size:14px}
    #list a{padding:6px 6px}
    .books label{padding:6px 0}
  }
</style>
</head>
<body>
<div id="wrap">
  <aside id="list">
    <div class="sheetbar"><span class="grip"></span>
      <button class="btn xbtn" data-close="list">閉じる</button></div>
    <h3>本でしぼる</h3>
    <div class="books" id="books"></div>
    <div style="margin-top:6px;display:flex;gap:6px">
      <button class="btn" id="bAll">ぜんぶ</button>
      <button class="btn" id="bNone">なし</button>
    </div>
    <div id="lists"></div>
  </aside>
  <div id="main">
    <header>
      <h1>mind-atlas<small>こころの地図</small></h1>
      <button class="btn" id="toggleList" title="一覧の開け閉め">一覧</button>
      <input type="search" id="q" placeholder="用語をさがす">
      <select id="layout">
        <option value="cose">ネットワーク</option>
        <option value="concentric">放射状</option>
        <option value="breadthfirst">木</option>
        <option value="circle">円</option>
      </select>
      <div class="filters" id="filters"></div>
    </header>
    <div id="cy"></div>
  </div>
  <aside id="side">
    <div class="sheetbar"><span class="grip"></span>
      <button class="btn xbtn" data-close="side">閉じる</button></div>
    <div id="sidebody">
    <p class="empty">ノードをクリックすると、ここに中身が出る。<br><br>
      形は種類で分けてある。丸＝用語、角丸四角＝書物、六角＝人物、菱形＝理論、三角＝実験、八角＝症例。<br><br>
      <b>破線の灰色</b>は「まだ書いていない用語」。線でつながっているのに中身が無いもの＝
      <b>次に調べる場所</b>が地図の上に見えている状態。<br><br>
      <b>赤い線</b>は「対立」。どこで論争が起きているかが、地図を見るだけで分かる。</p>
    </div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.34.2/cytoscape.min.js"></script>
<!-- fcose = ラベルの大きさを含めて配置してくれるレイアウト。読めなくても組み込みcoseに落ちる -->
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script>
const TYPE_SHAPE = {
  '用語':'ellipse', '人物':'hexagon', '理論':'diamond',
  '実験':'triangle', '症例':'octagon', '書物':'round-rectangle'
};
const TYPE_COLOR = {
  '用語':'#7a6da8','人物':'#4f8a6b','理論':'#c07a3e','実験':'#3f8b96','症例':'#8a6250','書物':'#3d5a80'
};
const DARK = window.matchMedia('(prefers-color-scheme:dark)').matches;
const INK  = DARK ? '#e6e2da' : '#2f2b26';
const SUB  = DARK ? '#9a938a' : '#8b857c';
const BG   = DARK ? '#1b1a18' : '#f7f6f3';
const EDGE = DARK ? '#4a463f' : '#c9c3b8';
const RED  = '#b4483f';

// ---- ② 脳の模式図 ----------------------------------------------------
// build_map.py の BRAIN_AREAS と必ず揃えること
const BRAIN_AREAS = {
  pfc:'前頭前野', vmpfc:'腹内側前頭前野', ofc:'眼窩前頭皮質', dlpfc:'背外側前頭前野',
  vlpfc:'腹外側前頭前野',
  motor:'一次運動野', somatosensory:'体性感覚野',
  parietal:'頭頂葉', occipital:'後頭葉', temporal:'側頭葉', insula:'島皮質',
  acc:'前部帯状回', pcc:'後部帯状回', corpus_callosum:'脳梁',
  amygdala:'扁桃体', hippocampus:'海馬', thalamus:'視床', hypothalamus:'視床下部',
  brainstem:'脳幹', cerebellum:'小脳'
};
// 正中矢状断（左を向いた頭を、まんなかで切った断面）では見えず、
// 外側や深部にあるので位置だけを破線で示すもの
const DEEP = ['amygdala','hippocampus','insula','dlpfc','vlpfc','temporal'];

// スマホでは、左右のパネルを「下からせり上がるシート」として扱う
const isPhone = () => window.matchMedia('(max-width:760px)').matches;
const sheet = id => document.getElementById(id);
function openSheet(id){
  ['list','side'].forEach(k => sheet(k).classList.toggle('open', k === id));
}
function closeSheets(){
  ['list','side'].forEach(k => sheet(k).classList.remove('open'));
}

let BRAIN_BASE = null;   // brain.svg（Lynch の解剖図）の中身
fetch('brain.svg').then(r => r.ok ? r.text() : null).then(t => {
  if (!t) return;
  const m = t.match(/<svg[^>]*>([\s\S]*)<\/svg>/i);
  if (m) BRAIN_BASE = m[1];
}).catch(() => { BRAIN_BASE = null; });

let cy, DATA;
let HAS_FCOSE = false;
try {
  if (window.cytoscapeFcose) { cytoscape.use(window.cytoscapeFcose); HAS_FCOSE = true; }
} catch (e) { HAS_FCOSE = false; }

fetch('data.json?' + Date.now()).then(r => r.json()).then(d => { DATA = d; boot(d); })
  .catch(e => { document.getElementById('cy').innerHTML =
    '<p style="padding:20px">data.json が読めなかった: ' + e + '</p>'; });

function boot(data){
  const elements = [];
  data.nodes.forEach(n => elements.push({ data:{
    id:n.id, label:n.id, type:n.type, stub:n.stub?1:0, node:n } }));
  data.edges.forEach((e,i) => elements.push({ data:{
    id:'e'+i, source:e.source, target:e.target, rel:e.rel,
    conflict:(e.rel.indexOf('対立')>=0 || e.rel.indexOf('批判')>=0)?1:0 } }));

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    wheelSensitivity: 0.75,   // ③ 0.25 は拡大に時間がかかりすぎた
    style: [
      { selector:'node', style:{
          'label':'data(label)', 'font-size':11, 'color':INK,
          'text-valign':'bottom', 'text-margin-y':4, 'text-wrap':'wrap',
          'text-max-width':92, 'width':26, 'height':26, 'border-width':0,
          'text-background-color':BG, 'text-background-opacity':0.72,
          'text-background-padding':2, 'text-background-shape':'roundrectangle',
          'min-zoomed-font-size':7,
          'background-color': e => TYPE_COLOR[e.data('type')] || '#7a6da8',
          'shape': e => TYPE_SHAPE[e.data('type')] || 'ellipse' } },
      { selector:'node[stub = 1]', style:{
          'background-color':SUB, 'background-opacity':0.25, 'border-width':1.5,
          'border-style':'dashed', 'border-color':SUB, 'color':SUB } },
      { selector:'node:selected', style:{
          'border-width':3, 'border-color':RED, 'border-style':'solid' } },
      { selector:'edge', style:{
          'width':1.3, 'line-color':EDGE, 'curve-style':'bezier',
          'target-arrow-shape':'triangle', 'target-arrow-color':EDGE,
          'arrow-scale':0.7, 'label':'data(rel)', 'font-size':9, 'color':SUB,
          'text-rotation':'autorotate', 'text-background-color':BG,
          'text-background-opacity':0.85, 'text-background-padding':2 } },
      { selector:'edge[conflict = 1]', style:{
          'width':2.2, 'line-color':RED, 'target-arrow-color':RED, 'color':RED } },
      { selector:'.dim', style:{ 'opacity':0.12 } }
    ],
    layout: layoutOpts('cose')
  });

  cy.on('tap','node', ev => show(ev.target.data('node')));
  cy.on('tap', ev => { if (ev.target === cy){ clearDim(); if (isPhone()) closeSheets(); } });
  document.querySelectorAll('[data-close]').forEach(b =>
    b.onclick = () => sheet(b.dataset.close).classList.remove('open'));

  buildFilters(data);
  buildList(data);
  document.getElementById('layout').onchange = e => cy.layout(layoutOpts(e.target.value)).run();
  document.getElementById('q').oninput = e => search(e.target.value.trim());
  document.querySelector('h1 small').textContent =
    'こころの地図　' + data.nodes.filter(n=>!n.stub).length + '語＋これから' +
    data.nodes.filter(n=>n.stub).length + '　（' + data.generated + '）';
}

function brainSVG(ids){
  const cls = id => (DEEP.indexOf(id) >= 0 ? 'deep' : 'area') +
                    (ids.indexOf(id) >= 0 ? ' hit' : '');
  const E = (id, cx, cy, rx, ry) =>
    '<ellipse class="' + cls(id) + '" cx="' + cx + '" cy="' + cy +
    '" rx="' + rx + '" ry="' + ry + '"/>';
  const G = (id, pts) => '<polygon class="' + cls(id) + '" points="' + pts + '"/>';

  // 座標は brain.svg（Lynch の解剖図）の viewBox 0 0 295.248 326.109 に合わせてある。
  // 下敷きの図に重ねて4回引き直し、目視で位置を合わせた。左が前。
  return '<svg viewBox="0 0 295.248 326.109" role="img" aria-label="脳の正中矢状断">' +
    (BRAIN_BASE
      ? '<g class="baseimg">' + BRAIN_BASE + '</g>'
      : '<text class="noimg" x="12" y="24">brain.svg が読めなかった</text>') +
    // 前頭葉のなかの区分
    E('pfc', 56, 95, 40, 52) +
    E('dlpfc', 55, 55, 37, 25) +
    E('vlpfc', 52, 112, 34, 20) +
    E('vmpfc', 76, 122, 15, 14) +
    E('ofc', 78, 140, 22, 7) +
    // 中心溝をはさむ2つ（内側面では傍中心小葉のあたり）
    E('motor', 120, 17, 12, 11) +
    E('somatosensory', 145, 17, 12, 11) +
    // 後方の葉
    E('parietal', 192, 40, 45, 30) +
    E('occipital', 263, 112, 29, 35) +
    E('temporal', 110, 134, 18, 10) +
    // 脳梁と、その外側を囲む帯状回
    G('corpus_callosum',
      '88,123 86,100 93,80 110,63 140,58 175,58 200,66 214,90 217,115 210,126 ' +
      '202,120 203,100 196,80 180,70 150,68 120,72 105,84 100,100 102,120') +
    G('acc', '76,128 72,98 80,70 100,48 135,36 155,34 154,45 132,47 105,58 92,76 85,98 88,124') +
    G('pcc', '190,70 210,82 222,100 224,118 220,130 211,127 214,114 212,98 203,86 186,78') +
    // 深部
    E('insula', 106, 124, 13, 10) +
    E('thalamus', 157, 110, 28, 18) +
    E('hypothalamus', 133, 136, 10, 7) +
    E('amygdala', 106, 137, 8, 6) +
    E('hippocampus', 120, 140, 10, 5) +
    // 脳幹と小脳
    G('brainstem', '130,130 182,128 184,155 178,200 172,250 168,324 148,324 150,270 147,195 138,160') +
    E('cerebellum', 228, 171, 43, 42) +
    '<text class="front" x="4" y="150">前</text>' +
    '<text class="front" x="278" y="150">後</text>' +
    '</svg>';
}

function layoutOpts(name){
  // nodeDimensionsIncludeLabels = ラベルの大きさも「ノードの大きさ」として扱う。
  // これが重なりの根治。丸だけを避けて置くと、下に伸びる文字がぶつかる。
  const base = { name:name, animate:true, animationDuration:450, padding:60,
                 nodeDimensionsIncludeLabels:true };
  if (name === 'cose'){
    if (HAS_FCOSE)
      return Object.assign(base, { name:'fcose', quality:'proof', randomize:true,
        idealEdgeLength:170, nodeRepulsion:14000, nodeSeparation:150,
        gravity:0.12, gravityRange:3.2, numIter:2500,
        packComponents:true, tile:true });
    // fcose が読めなかったときの受け皿。組み込み cose を目一杯広げる
    return Object.assign(base, { idealEdgeLength:190, nodeRepulsion:45000,
      nodeOverlap:90, gravity:0.15, numIter:2000, componentSpacing:160,
      randomize:false });
  }
  if (name === 'concentric')
    return Object.assign(base, { minNodeSpacing:95,
      concentric: n => n.degree(), levelWidth: () => 1 });
  if (name === 'breadthfirst')
    return Object.assign(base, { spacingFactor:2.1, circle:false });
  if (name === 'circle')
    return Object.assign(base, { spacingFactor:1.6 });
  return base;
}

function buildFilters(data){
  const box = document.getElementById('filters');
  [...new Set(data.nodes.map(n => n.type))].sort().forEach(t => {
    const lab = document.createElement('label');
    lab.innerHTML = '<input type="checkbox" id="f_' + t + '" checked>' +
      '<span class="dot" style="background:' + (TYPE_COLOR[t]||'#888') + '"></span>' + t;
    box.appendChild(lab);
    lab.querySelector('input').onchange = applyFilters;
  });
  const lab = document.createElement('label');
  lab.innerHTML = '<input type="checkbox" id="f_stub" checked>' +
    '<span class="dot" style="background:' + SUB + '"></span>これから調べる';
  box.appendChild(lab);
  lab.querySelector('input').onchange = applyFilters;
}

// ---- ① 一覧パネル ----------------------------------------------------
const ORDER = ['書物','人物','理論','症例','実験','用語'];

function buildList(data){
  // 「本でしぼる」= 書物ノードごとのチェックボックス。キーは その本の 出典 の値
  const books = data.nodes.filter(n => n.type === '書物' && !n.stub)
                          .sort((a,b) => (a.sources[0]||'').localeCompare(b.sources[0]||''));
  const bbox = document.getElementById('books');
  bbox.innerHTML = '';
  books.forEach(b => {
    const key = b.sources[0] || b.id;
    const lab = document.createElement('label');
    lab.innerHTML = '<input type="checkbox" data-book="' + esc(key) + '" checked>' +
      '<span>' + esc(b.id) + '<br><span class="sub">' + esc(key) + '</span></span>';
    bbox.appendChild(lab);
    lab.querySelector('input').onchange = applyFilters;
  });
  if (!books.length) bbox.innerHTML = '<p class="sub">まだ書物のノードが無い。</p>';

  document.getElementById('bAll').onclick = () => setBooks(true);
  document.getElementById('bNone').onclick = () => setBooks(false);
  document.getElementById('toggleList').onclick = () => {
    const el = sheet('list');
    if (isPhone()){
      if (el.classList.contains('open')) el.classList.remove('open');
      else openSheet('list');
    } else {
      el.classList.toggle('closed');
      setTimeout(() => cy.resize(), 60);
    }
  };
  renderLists();
}

function setBooks(on){
  document.querySelectorAll('#books input').forEach(i => i.checked = on);
  applyFilters();
}

function renderLists(){
  let h = '';
  const group = (title, ns, color) => {
    if (!ns.length) return '';
    let g = '<h3><span class="dot" style="background:' + color + '"></span>' +
            esc(title) + ' <span class="n">' + ns.length + '</span></h3><ul>';
    ns.forEach(n => {
      const mk = (!n.stub && !(n.refs && n.refs.length))
        ? '<span class="mk" title="外部の情報源に当たっていない">記憶</span>' : '';
      g += '<li><a data-id="' + esc(n.id) + '">' + esc(n.id) + mk + '</a></li>';
    });
    return g + '</ul>';
  };
  const byId = (a,b) => a.id.localeCompare(b.id, 'ja');
  ORDER.forEach(t => {
    h += group(t, DATA.nodes.filter(n => n.type === t && !n.stub).sort(byId),
               TYPE_COLOR[t] || '#888');
  });
  h += group('これから調べる', DATA.nodes.filter(n => n.stub).sort(byId), SUB);
  const box = document.getElementById('lists');
  box.innerHTML = h;
  box.querySelectorAll('a[data-id]').forEach(a =>
    a.onclick = () => focusNode(a.dataset.id));
}

function focusNode(id){
  const t = cy.getElementById(id);
  if (!t.length) return;
  cy.nodes().unselect();
  t.select();
  cy.animate({ fit:{ eles:t.closedNeighborhood(), padding:90 }, duration:380 });
  show(t.data('node'));
  markActive(id);
}

function markActive(id){
  document.querySelectorAll('#lists a[data-id]').forEach(a =>
    a.classList.toggle('on', a.dataset.id === id));
}

function applyFilters(){
  const stubOn = document.getElementById('f_stub').checked;
  // チェックが入っている本のキー
  const on = new Set([...document.querySelectorAll('#books input:checked')]
                     .map(i => i.dataset.book));
  cy.nodes().forEach(n => {
    const d = n.data('node');
    const box = document.getElementById('f_' + n.data('type'));
    let vis = (!box || box.checked) && (stubOn || !n.data('stub'));
    // 本でしぼる：出典を持つノードだけが対象。
    // 出典を1つも持たないノード（本に紐づかない概念・stub）は常に残す。
    // 複数の本にまたがるノードは、どれか1冊でも表示中なら残る（橋を切らないため）。
    if (vis && d && d.sources && d.sources.length)
      vis = d.sources.some(k => on.has(k));
    n.style('display', vis ? 'element' : 'none');
  });
  // 一覧側でも、消えているものを薄くする
  document.querySelectorAll('#lists a[data-id]').forEach(a => {
    const el = cy.getElementById(a.dataset.id);
    const hidden = el.length && el.style('display') === 'none';
    a.style.opacity = hidden ? 0.3 : 1;
  });
}

function search(q){
  clearDim();
  if (!q) return;
  const hit = cy.nodes().filter(n => n.data('label').indexOf(q) >= 0);
  if (!hit.length) return;
  cy.elements().addClass('dim');
  hit.removeClass('dim');
  hit.neighborhood().removeClass('dim');
  hit.connectedEdges().removeClass('dim');
  cy.animate({ fit:{ eles:hit.union(hit.neighborhood()), padding:70 }, duration:380 });
  if (hit.length === 1) show(hit[0].data('node'));
}
function clearDim(){ if (cy) cy.elements().removeClass('dim'); }

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function md(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
}

function show(n){
  const side = document.getElementById('side');
  const body = document.getElementById('sidebody') || side;
  const color = TYPE_COLOR[n.type] || '#7a6da8';
  let h = '<h2>' + esc(n.id) +
    (n.stub ? '<span class="stubmark">これから調べる</span>' : '') + '</h2>';
  h += '<div class="meta"><span class="badge" style="background:' + color + '">' +
       esc(n.type) + '</span><span class="conf">' + esc(n.confidence) + '</span>';
  if (n.sources.length) h += '<br>出典: ' + n.sources.map(esc).join(' / ');
  if (n.file) h += '<br><span style="opacity:.7">' + esc(n.file) + '</span>';
  h += '</div>';

  if (n.stub){
    h += '<p class="empty">この用語は、まだ中身を書いていない。<br>' +
         '他のノードから線が引かれているので、地図には出ている。<br><br>' +
         '<code>nodes/' + esc(n.id) + '.md</code> を作れば、ここに中身が出る。</p>';
  } else {
    const keys = Object.keys(n.sections);
    if (!keys.length) h += '<p class="empty">本文がまだ空。</p>';
    keys.forEach(k => { h += '<h3>' + esc(k) + '</h3><div>' + md(n.sections[k]) + '</div>'; });
  }

  // ② 脳の部位が指定されていれば、模式図で光らせる
  if (n.brain && n.brain.length){
    h += '<h3>脳のどこか</h3><div class="brain">' + brainSVG(n.brain) + '</div>';
    h += '<p class="brainnames">' + n.brain.map(b =>
      '<span class="hit">' + esc(BRAIN_AREAS[b] || b) + '</span>').join(' ／ ') + '</p>';
    h += '<p class="brainnote">正中矢状断（頭をまんなかで切った断面）。左が前。' +
         '色を重ねた場所が、その用語の関わる領域。<b>境界はおおよそ</b>で、' +
         '研究によって定義が違う。破線は、この断面には現れない' +
         '（外側や深部にある）ので位置だけを示したもの。</p>' +
         '<p class="brainnote brcredit">図：<a href="https://commons.wikimedia.org/wiki/' +
         'File:Brain_human_sagittal_section.svg" target="_blank" rel="noopener noreferrer">' +
         'Patrick J. Lynch, medical illustrator</a>（<a href="https://creativecommons.org/' +
         'licenses/by/2.5/" target="_blank" rel="noopener noreferrer">CC BY 2.5</a>）を改変。' +
         '色を重ねた部分は本サイトによる。</p>';
  }

  const out = DATA.edges.filter(e => e.source === n.id);
  const inn = DATA.edges.filter(e => e.target === n.id);
  if (out.length || inn.length){
    h += '<h3>つながり</h3><ul class="links">';
    out.forEach(e => h += '<li><a data-go="' + esc(e.target) + '">' + esc(e.target) +
      '</a> <span class="rel">← ' + esc(e.rel) + '</span></li>');
    inn.forEach(e => h += '<li><a data-go="' + esc(e.source) + '">' + esc(e.source) +
      '</a> <span class="rel">→ ' + esc(e.rel) + '（こちらへ）</span></li>');
    h += '</ul>';
  }
  // 記事のいちばん下に引用元。refs が空なら「記憶で書いた」と正直に出す
  if (n.refs && n.refs.length){
    h += '<h3>引用元</h3><ol class="refs">';
    n.refs.forEach(r => {
      const safe = /^https?:\/\//i.test(r.url) ? r.url : '';
      h += '<li>';
      h += safe ? '<a href="' + esc(safe) + '" target="_blank" rel="noopener noreferrer">' +
                  esc(r.title) + '</a>'
                : esc(r.title);
      if (r.note) h += '<div class="note">' + esc(r.note) + '</div>';
      if (safe)  h += '<div class="url">' + esc(safe) + '</div>';
      h += '</li>';
    });
    h += '</ol>';
  } else if (!n.stub){
    h += '<h3>引用元</h3><p class="norefs">外部の情報源には当たっていない。' +
         'ここに書かれているのは大河の記憶による。</p>';
  }

  body.innerHTML = h;
  side.scrollTop = 0;
  if (isPhone()) openSheet('side');     // スマホは中身を大きく出す
  body.querySelectorAll('a[data-go]').forEach(a => a.onclick = () => {
    const t = cy.getElementById(a.dataset.go);
    if (t.length){
      cy.animate({ fit:{ eles:t.closedNeighborhood(), padding:80 }, duration:380 });
      show(t.data('node'));
    }
  });
}
</script>
</body>
</html>
